<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <style>
      /* Runtime component CSS can load before the root stylesheet in production. */
      @layer reset, tokens, base, vendor, utilities, ropav.tokens, ropav.components;
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#5a2d82" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>WebOS</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P3L2M0RW61"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-P3L2M0RW61");
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("settings:state");
          var pref = "system";
          if (raw) {
            var o = JSON.parse(raw);
            if (o && o.data && typeof o.data.theme === "string") pref = o.data.theme;
          }
          var r =
            pref === "light" || pref === "dark"
              ? pref
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = r;
          document.documentElement.dataset.rpColorScheme = r;
        } catch (e) {
          var fallback = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = fallback;
          document.documentElement.dataset.rpColorScheme = fallback;
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
