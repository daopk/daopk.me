name: Publish shell image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/**"
      - "blog/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    env:
      DAOPK_PUBLIC_ASSET_BASE_URL: https://cdn.daopk.me/
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      R2_ASSETS_BUCKET: daopk-assets

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Resolve build metadata
        id: build-meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shell assets
        env:
          DAOPK_BUILD_TIME: ${{ steps.build-meta.outputs.build_time }}
        run: pnpm build

      - name: Sync hashed assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail

          if ! command -v aws >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
              --output "/tmp/awscliv2.zip"
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
          fi

          aws configure set default.s3.max_concurrent_requests 32
          asset_count=$(find dist/assets -type f | wc -l | tr -d " ")
          echo "Syncing $asset_count hashed asset(s) to R2 bucket '$R2_ASSETS_BUCKET'."

          aws s3 sync dist/assets/ "s3://$R2_ASSETS_BUCKET/assets/" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --size-only \
            --no-progress

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          build-args: |
            DAOPK_BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
            DAOPK_PUBLIC_ASSET_BASE_URL=${{ env.DAOPK_PUBLIC_ASSET_BASE_URL }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
