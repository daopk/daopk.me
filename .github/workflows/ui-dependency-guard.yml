name: UI dependency guard

on:
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "scripts/check-no-reka-ui.sh"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "scripts/check-no-reka-ui.sh"

permissions:
  contents: read

jobs:
  no-reka-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject reka-ui imports
        run: bash scripts/check-no-reka-ui.sh
