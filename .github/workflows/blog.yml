name: Publish blog

# Adding/editing/removing a post is just committing markdown under blog/.
# This workflow rebuilds the publish bundle (runtime index.json + raw .md +
# prerendered SEO HTML + sitemap) and uploads it to the Cloudflare R2 bucket the
# Worker serves from. It does NOT deploy the app: Cloudflare's own build is
# configured to ignore blog/, so app deploys and content publishing stay
# decoupled and never deploy twice.
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "scripts/build-blog-bundle.mjs"
      - "scripts/lib/blogPosts.mjs"
  workflow_dispatch: {}

# Serialize publishes so two quick pushes can't race uploads to the same keys.
concurrency:
  group: blog-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: daopk-blog

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blog bundle
        run: pnpm blog:bundle

      - name: Upload bundle to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s globstar nullglob
          uploaded=0
          for file in blog-dist/**/*; do
            [ -f "$file" ] || continue
            key="${file#blog-dist/}"
            case "$file" in
              *.json) content_type="application/json;charset=utf-8" ;;
              *.md)   content_type="text/markdown;charset=utf-8" ;;
              *.html) content_type="text/html;charset=utf-8" ;;
              *.xml)  content_type="application/xml;charset=utf-8" ;;
              *)      content_type="application/octet-stream" ;;
            esac
            echo "Uploading $key ($content_type)"
            pnpm exec wrangler r2 object put "$R2_BUCKET/$key" \
              --file "$file" \
              --content-type "$content_type" \
              --remote
            uploaded=$((uploaded + 1))
          done
          echo "Uploaded $uploaded object(s) to R2 bucket '$R2_BUCKET'."
