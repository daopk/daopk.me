name: Publish apps

# Building or updating a first-party app is just committing to apps/<id>/.
# This workflow builds ONLY the changed app packages, uploads their immutable,
# release-pinned ES modules to the Cloudflare R2 bucket that the public API
# exposes under /public/apps/*, and updates the catalog (/public/apps/index.json)
# to point at the new versions. It does NOT deploy the shell; the shell image has
# its own deploy workflow so app publishes and shell deploys stay independent.
#
# Immutability contract: a module URL is /apps/<id>/<version+build>/<id>.js and
# is cached `immutable`. The package.json "version" is the manual, user-facing
# semver; each app's catalog entry owns its own automatic build number so
# same-version publishes produce a fresh URL and a detectable app update.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Rebuild a single app id (blank = all apps)"
        required: false
        default: ""

# Serialize publishes so two quick pushes can't race the catalog read/modify/write.
concurrency:
  group: apps-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: daopk-apps

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git diff <before>..<after>` can resolve any base.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Detect changed apps
        id: detect
        run: node scripts/detect-changed-apps.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          DISPATCH_APP: ${{ github.event.inputs.app }}

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One independent build per changed app. Each uploads only its own
      # release-pinned module keys (no shared keys), so the matrix never races.
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm --filter "@daopk-app/${{ matrix.app }}" build
        env:
          VITE_PUBLIC_API_ORIGIN: ${{ vars.VITE_PUBLIC_API_ORIGIN }}

      - name: Upload module(s) to R2 + emit catalog entry
        env:
          APP: ${{ matrix.app }}
          EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          dist="apps/$APP/dist"
          if [ ! -d "$dist" ]; then
            echo "::error::No build output at $dist for '$APP'."
            exit 1
          fi

          version="$(node -p "require('./apps/$APP/package.json').version")"
          revision="${GITHUB_SHA:0:7}"
          # Convention: the lib build emits <id>.js as the entry module.
          entry_file="$APP.js"
          if [ ! -f "$dist/$entry_file" ]; then
            echo "::error::Expected entry $dist/$entry_file (lib build must emit <id>.js)."
            exit 1
          fi

          # Build numbers are per app: read the live catalog, then increment
          # only this app's current build. Missing catalog means first publish.
          if ! pnpm exec wrangler r2 object get "$R2_BUCKET/index.json" \
                --file current-catalog.json --remote 2>/dev/null; then
            echo "No existing catalog; starting $APP at build 1."
            rm -f current-catalog.json
          fi
          build="$(node scripts/next-app-build.mjs current-catalog.json "$APP")"
          if ! [[ "$build" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Next build for $APP must be a positive integer; got '$build'."
            exit 1
          fi

          # Immutable URLs must never change bytes. On push, skip orphaned
          # release keys left by an interrupted publish; manual dispatch may
          # overwrite to recover intentionally.
          while true; do
            release="$version+$build"
            entry_key="$APP/$release/$entry_file"
            if [ "$EVENT_NAME" != "push" ] || \
               ! pnpm exec wrangler r2 object get "$R2_BUCKET/$entry_key" --remote >/dev/null 2>&1; then
              break
            fi
            echo "$APP@$release already exists at $entry_key; trying next build."
            build="$((build + 1))"
          done
          echo "Using per-app build $build for $APP."

          shopt -s globstar nullglob
          for file in "$dist"/**/*; do
            [ -f "$file" ] || continue
            rel="${file#"$dist"/}"
            key="$APP/$release/$rel"
            case "$file" in
              *.js)  content_type="text/javascript;charset=utf-8" ;;
              *.css) content_type="text/css;charset=utf-8" ;;
              *.map) content_type="application/json;charset=utf-8" ;;
              *)     content_type="application/octet-stream" ;;
            esac
            echo "Uploading $key ($content_type)"
            pnpm exec wrangler r2 object put "$R2_BUCKET/$key" \
              --file "$file" \
              --content-type "$content_type" \
              --remote
          done

          mkdir -p catalog-entries
          APP="$APP" VERSION="$version" BUILD="$build" REVISION="$revision" ENTRY="/apps/$APP/$release/$entry_file" node -e '
            const fs = require("node:fs");
            const build = Number(process.env.BUILD);
            const manifestPath = `apps/${process.env.APP}/app.manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.id !== process.env.APP) {
              throw new Error(`Manifest id ${manifest.id} does not match ${process.env.APP}.`);
            }
            const entry = {
              id: process.env.APP,
              version: process.env.VERSION,
              build,
              revision: process.env.REVISION,
              entry: process.env.ENTRY,
              manifest,
            };
            fs.writeFileSync(`catalog-entries/${process.env.APP}.json`, JSON.stringify(entry));
          '
          echo "Catalog entry: $(cat "catalog-entries/$APP.json")"

      - name: Stash catalog entry
        uses: actions/upload-artifact@v7
        with:
          name: catalog-entry-${{ matrix.app }}
          path: catalog-entries/${{ matrix.app }}.json
          retention-days: 1

  publish-catalog:
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect catalog entries
        uses: actions/download-artifact@v8
        with:
          path: catalog-entries
          pattern: catalog-entry-*
          merge-multiple: true

      - name: Merge + publish catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Pull the live catalog so unchanged apps' entries are preserved. The
          # key may not exist yet on the very first publish — that's fine, the
          # merge script then starts from an empty catalog.
          if ! pnpm exec wrangler r2 object get "$R2_BUCKET/index.json" \
                --file current-catalog.json --remote 2>/dev/null; then
            echo "No existing catalog; starting fresh."
            rm -f current-catalog.json
          fi

          node scripts/update-apps-catalog.mjs current-catalog.json catalog-entries merged-catalog.json
          echo "Publishing catalog:"
          cat merged-catalog.json

          pnpm exec wrangler r2 object put "$R2_BUCKET/index.json" \
            --file merged-catalog.json \
            --content-type "application/json;charset=utf-8" \
            --remote
