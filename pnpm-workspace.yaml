allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  vue-demi: false
  # workerd ships wrangler's local runtime; R2 publish workflows do not need
  # its binary, so skip the heavy postinstall download.
  workerd: false
catalog:
  "@vitejs/plugin-vue": ^6.0.8
  ropav: ^0.1.6
  vite: ^8.1.5
  vue: 3.6.0-rc.1
  vue-tsc: ^3.3.7
minimumReleaseAgeExclude:
  - ropav@0.1.5 || 0.1.6
  - "@vue/compiler-core@3.6.0-rc.1"
  - "@vue/compiler-dom@3.6.0-rc.1"
  - "@vue/compiler-sfc@3.6.0-rc.1"
  - "@vue/compiler-ssr@3.6.0-rc.1"
  - "@vue/compiler-vapor@3.6.0-rc.1"
  - "@vue/reactivity@3.6.0-rc.1"
  - "@vue/runtime-core@3.6.0-rc.1"
  - "@vue/runtime-dom@3.6.0-rc.1"
  - "@vue/runtime-vapor@3.6.0-rc.1"
  - "@vue/server-renderer@3.6.0-rc.1"
  - "@vue/shared@3.6.0-rc.1"
  - vue@3.6.0-rc.1
  - "@iconify-json/lucide@1.2.118"
packages:
  - .
  - apps/*
