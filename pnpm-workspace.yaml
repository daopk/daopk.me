allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  vue-demi: false
  # workerd ships wrangler's local runtime; R2 publish workflows do not need
  # its binary, so skip the heavy postinstall download.
  workerd: false
catalog:
  "@vitejs/plugin-vue": ^6.0.8
  ropav: ^0.1.7
  vite: ^8.1.5
  vue: 3.6.0-rc.2
  vue-tsc: 3.3.8
minimumReleaseAge: 0
packages:
  - .
  - apps/*
