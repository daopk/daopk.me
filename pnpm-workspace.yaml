allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  vue-demi: false
  # workerd ships wrangler's local runtime; R2 publish workflows do not need
  # its binary, so skip the heavy postinstall download.
  workerd: false
catalog:
  ropav: ^0.0.13
  vue: 3.6.0-beta.17
minimumReleaseAgeExclude:
  - ropav@0.0.13
packages:
  - .
  - apps/*
